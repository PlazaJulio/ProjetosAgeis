<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onboardly • Assistente</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <strong>Onboardly</strong>
        <small class="env">local</small>
      </div>
      <div id="status" class="status badge">checando base…</div>
    </header>

    <!-- a div de mensagens agora usa o ID "messages" -->
    <main id="messages" class="chat"></main>

    <footer class="composer">
      <form id="chatForm" autocomplete="off">
        <textarea id="chatInput" rows="1" placeholder="Digite sua mensagem..."></textarea>
        <button id="sendBtn" type="submit" aria-label="Enviar">
          Enviar
        </button>
      </form>
    </footer>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
